[package]
name = "benny-rs"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.103"
async-trait = "0.1.89"
axum = "0.8.9"
chrono = { version = "0.4.45", features = ["serde"] }
dashmap = "6.2.1"
humantime = "2.3.0"
mongodb = "3.7.0"
parking_lot = "0.12.5"
rand = "0.10.1"
redis = { version = "1.2.4", features = ["tokio-comp", "connection-manager"] }
regex = "1.12.4"
reqwest = { version = "0.13.4", default-features = false, features = ["rustls", "json", "form", "query"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
serenity = "0.12.5"
sqlx = { version = "0.9.0", features = ["runtime-tokio", "tls-rustls-aws-lc-rs", "sqlite", "migrate", "macros"] }
sysinfo = "0.39.5"
thiserror = "2.0.18"
tokio = { version = "1.52.3", features = ["full"] }
tokio-util = "0.7.18"
tracing = "0.1.44"
tracing-appender = "0.2.5"
tracing-subscriber = { version = "0.3.23", features = ["time"] }
uuid = { version = "1.23.4", features = ["v4"] }
