[package]
name = "benny-rs"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.103"
async-trait = "0.1.89"
axum = "0.8.9"
chrono = { version = "0.4.45", features = ["serde"] }
dashmap = "6.2.1"
decancer = "3.3.3"
interim = { version = "0.2.1", default-features = false, features = ["std", "chrono_0_4"] }
lavalink-rs = { version = "0.15.0", features = ["serenity"] }
unicode_names2 = "3.1.0"
humantime = "2.3.0"
parking_lot = "0.12.5"
rand = "0.10.1"
redis = { version = "1.2.4", features = ["tokio-comp", "connection-manager", "tokio-rustls-comp"] }
regex = "1.12.4"
reqwest = { version = "0.13.4", default-features = false, features = ["rustls", "json", "form", "query"] }
# Direct dep so we can install a process-default rustls CryptoProvider at
# startup; the tree enables both aws-lc-rs and ring, which otherwise leaves
# rustls with no default and panics any TLS path that relies on it.
rustls = "0.23"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
serenity = "0.12.5"
# SeaORM 2.0 is the first release line built on sqlx 0.9 (still RC at time of
# writing). Default features off to avoid pulling unused DB drivers; we share
# the existing sqlx SqlitePool via `From<SqlitePool>` for DatabaseConnection.
sea-orm = { version = "2.0.0-rc.41", default-features = false, features = ["sqlx-sqlite", "runtime-tokio-rustls", "macros"] }
sea-orm-migration = { version = "2.0.0-rc.41", default-features = false, features = ["sqlx-sqlite", "runtime-tokio-rustls"] }
sqlx = { version = "0.9.0", features = ["runtime-tokio", "tls-rustls-aws-lc-rs", "sqlite", "migrate", "macros"] }
sysinfo = "0.39.5"
thiserror = "2.0.18"
tokio = { version = "1.52.3", features = ["full"] }
tokio-util = "0.7.18"
# Pinned to match serenity 0.12's gateway websocket Message type, so we can
# forward a raw voice-state-update (opcode 4) through `ShardMessenger`.
tokio-tungstenite = { version = "0.21", default-features = false }
tracing = "0.1.44"
tracing-appender = "0.2.5"
tracing-subscriber = { version = "0.3.23", features = ["time"] }
uuid = { version = "1.23.4", features = ["v4"] }
